
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Range</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      z-index: 100;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font: bold 38px Arial, sans-serif;
      text-shadow: 0 0 5px black;
      z-index: 101;
      pointer-events: none;
      display: none;
    }

    #instructions {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      color: white;
      text-align: center;
      font-size: 14px;
      text-shadow: 0 1px 5px black;
      z-index: 100;
      pointer-events: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="status">AR RANGE — przygotowanie</div>
  <div id="crosshair">+</div>
  <div id="instructions">
    Uruchom AR i skieruj telefon na podłogę.
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

    const status = document.getElementById('status');
    const crosshair = document.getElementById('crosshair');
    const instructions = document.getElementById('instructions');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70, window.innerWidth / window.innerHeight, 0.01, 20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');

    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

    // KÓŁKO WYBORU MIEJSCA
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.07, 0.09, 32),
      new THREE.MeshBasicMaterial({
        color: 0x00ff88,
        side: THREE.DoubleSide
      })
    );

    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const targets = [];

    // TARCZA
    function createTarget() {
      const group = new THREE.Group();

      const hitArea = new THREE.Mesh(
        new THREE.CircleGeometry(0.21, 48),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.001,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      hitArea.rotation.x = -Math.PI / 2;
      group.add(hitArea);

      function addRing(radius, thickness, color) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(radius, thickness, 12, 64),
          new THREE.MeshBasicMaterial({ color })
        );

        ring.rotation.x = -Math.PI / 2;
        group.add(ring);
      }

      addRing(0.20, 0.012, 0xffffff);
      addRing(0.15, 0.015, 0xe52b2b);
      addRing(0.10, 0.012, 0xffffff);
      addRing(0.05, 0.018, 0xe52b2b);

      return group;
    }

    // PRZYCISK URUCHAMIAJĄCY AR
    document.body.appendChild(
      ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      })
    );

    // WEJŚCIE WEBXR — PRZYWRÓCONY MECHANIZM
    const controller = renderer.xr.getController(0);
    scene.add(controller);

    // WYKRYWANIE POWIERZCHNI
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // STRZELANIE
    const raycaster = new THREE.Raycaster();
    const shotOrigin = new THREE.Vector3();
    const shotDirection = new THREE.Vector3();

    function shoot() {
      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(shotOrigin);
      xrCamera.getWorldDirection(shotDirection);

      raycaster.set(shotOrigin, shotDirection);

      const hits = raycaster.intersectObjects(targets, true);

      if (hits.length === 0) {
        status.textContent = 'PUDŁO!';
        status.style.color = '#ff7777';
        return;
      }

      const hit = hits[0];

      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.018, 16, 12),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00,
          depthTest: false
        })
      );

      marker.position.copy(hit.point);
      marker.renderOrder = 20;
      scene.add(marker);

      status.textContent = 'TRAFIENIE!';
      status.style.color = '#00ff88';

      setTimeout(() => {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();
      }, 5000);
    }

    // PIERWSZE SELECT USTAWIA TARCZĘ,
    // KOLEJNE SELECT ODDają STRZAŁ
    controller.addEventListener('select', () => {
      if (targets.length === 0) {
        if (!reticle.visible) {
          status.textContent =
            'Znajdź powierzchnię i poczekaj na zielone kółko.';
          return;
        }

        const target = createTarget();

        target.position.setFromMatrixPosition(reticle.matrix);
        target.quaternion.setFromRotationMatrix(reticle.matrix);

        scene.add(target);
        targets.push(target);

        reticle.visible = false;
        crosshair.style.display = 'block';

        instructions.textContent =
          'Celuj znakiem + w tarczę i użyj dotknięcia, aby strzelić.';

        status.textContent = 'TARCZA GOTOWA — CELUJ I STRZELAJ';
        status.style.color = '#00ff88';
        return;
      }

      shoot();
    });

    // PĘTLA AR — ZACHOWANY HIT-TEST
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer')
            .then((viewerSpace) => {
              return session.requestHitTestSource({
                space: viewerSpace
              });
            })
            .then((source) => {
              hitTestSource = source;
            })
            .catch((error) => {
              console.error('Hit-test error:', error);
              status.textContent = 'Błąd wykrywania AR';
            });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            reticle.visible = false;
            crosshair.style.display = 'none';
            targets.length = 0;

            status.textContent = 'AR RANGE — przygotowanie';
            instructions.textContent =
              'Uruchom AR i skieruj telefon na podłogę.';
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource && targets.length === 0) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);

            status.textContent =
              'Dotknij ekranu, aby ustawić tarczę.';
          } else {
            reticle.visible = false;

            status.textContent =
              'Powoli porusz telefonem, aby znaleźć powierzchnię.';
          }
        } else if (targets.length > 0) {
          reticle.visible = false;
        }
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
