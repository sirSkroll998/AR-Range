
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Range</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      font-size: 16px;
      z-index: 10;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font: bold 34px Arial, sans-serif;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 5px black;
    }

    #instructions {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      color: white;
      text-align: center;
      font-size: 14px;
      text-shadow: 0 1px 4px black;
      z-index: 5;
      pointer-events: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="status">AR RANGE — przygotowanie sceny</div>
  <div id="crosshair">+</div>
  <div id="instructions">
    Uruchom AR. Skieruj telefon na podłogę i dotknij ekranu,
    aby ustawić tarczę. Potem celuj środkiem ekranu i strzelaj.
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

    const status = document.getElementById('status');

    // SCENA
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');

    document.body.appendChild(renderer.domElement);

    // OŚWIETLENIE
    const light = new THREE.HemisphereLight(
      0xffffff,
      0x777777,
      2
    );

    scene.add(light);

    // CELOWNIK AR — wskazuje wykrytą powierzchnię
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.07, 0.09, 32),
      new THREE.MeshBasicMaterial({
        color: 0x00ff88,
        side: THREE.DoubleSide
      })
    );

    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // TABLICE CELÓW
    const targets = [];

    function createTarget() {
      const group = new THREE.Group();

      // Niewidoczna powierzchnia wykrywania trafień
      const hitArea = new THREE.Mesh(
        new THREE.CircleGeometry(0.21, 48),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.001,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      hitArea.rotation.x = -Math.PI / 2;
      group.add(hitArea);

      function addRing(radius, thickness, color) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(
            radius,
            thickness,
            12,
            64
          ),
          new THREE.MeshBasicMaterial({
            color: color
          })
        );

        ring.rotation.x = -Math.PI / 2;
        group.add(ring);
      }

      // Tarcza w czerwono-białe pierścienie
      addRing(0.20, 0.012, 0xffffff);
      addRing(0.15, 0.015, 0xe52b2b);
      addRing(0.10, 0.012, 0xffffff);
      addRing(0.05, 0.018, 0xe52b2b);

      return group;
    }

    // URUCHOMIENIE TRYBU AR
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    });

    document.body.appendChild(arButton);

    const controller = renderer.xr.getController(0);
    scene.add(controller);

    // WYKRYWANIE POWIERZCHNI
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // STRZELANIE
    const raycaster = new THREE.Raycaster();
    const shotOrigin = new THREE.Vector3();
    const shotDirection = new THREE.Vector3();
    const hitMarkers = [];

    function shoot() {
      if (targets.length === 0) {
        status.textContent = 'Najpierw umieść tarczę!';
        return;
      }

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(shotOrigin);
      xrCamera.getWorldDirection(shotDirection);

      raycaster.set(shotOrigin, shotDirection);

      const hits = raycaster.intersectObjects(targets, true);

      if (hits.length === 0) {
        status.textContent = 'PUDŁO!';
        return;
      }

      const hit = hits[0];

      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.018, 16, 12),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00
        })
      );

      marker.position.copy(hit.point);
      scene.add(marker);
      hitMarkers.push(marker);

      status.textContent = 'TRAFIENIE!';

      setTimeout(() => {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();

        const index = hitMarkers.indexOf(marker);

        if (index !== -1) {
          hitMarkers.splice(index, 1);
        }
      }, 5000);
    }

    // PIERWSZE DOTKNIĘCIE USTAWIA TARCZĘ.
    // KOLEJNE DOTKNIĘCIA ODDAJĄ STRZAŁ.
    controller.addEventListener('select', () => {
      if (targets.length === 0) {
        if (!reticle.visible) {
          status.textContent =
            'Skieruj telefon na podłogę i znajdź zielony celownik.';
          return;
        }

        const target = createTarget();

        target.position.setFromMatrixPosition(reticle.matrix);
        target.quaternion.setFromRotationMatrix(reticle.matrix);

        scene.add(target);
        targets.push(target);

        status.textContent =
          'Tarcza gotowa — celuj środkiem ekranu i strzelaj!';

        return;
      }

      shoot();
    });

    // PĘTLA RENDERUJĄCA AR
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();

        const referenceSpace =
          renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer')
            .then((viewerSpace) => {
              session.requestHitTestSource({
                space: viewerSpace
              }).then((source) => {
                hitTestSource = source;
              });
            });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            reticle.visible = false;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(
            hitTestSource
          );

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(
              pose.transform.matrix
            );

            if (targets.length === 0) {
              status.textContent =
                'Dotknij ekranu, aby ustawić tarczę.';
            }
          } else {
            reticle.visible = false;

            if (targets.length === 0) {
              status.textContent =
                'Powoli poruszaj telefonem, aby wykryć powierzchnię.';
            }
          }
        }
      }

      renderer.render(scene, camera);
    });

    // DOPASOWANIE DO ROZMIARU EKRANU
    window.addEventListener('resize', () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
