
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Range Beta 0.3</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.82);
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 24px;
      height: 24px;
      display: none;
      pointer-events: none;
    }

    #crosshair::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 0;
      width: 1px;
      height: 24px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #crosshair::after {
      content: "";
      position: absolute;
      left: 0;
      top: 11px;
      width: 24px;
      height: 1px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #distanceMenu {
      display: none;
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(300px, calc(100vw - 40px));
      padding: 18px;
      border-radius: 14px;
      background: rgba(10, 15, 20, 0.96);
      border: 1px solid #555;
      text-align: center;
    }

    #distanceMenu h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    #distanceMenu p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.4;
    }

    .distanceButton {
      display: block;
      width: 100%;
      margin-top: 9px;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #202a30;
      color: white;
      font-size: 17px;
      font-weight: bold;
      touch-action: manipulation;
    }

    .distanceButton:active {
      background: #087f52;
    }

    #scoreboard {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 10;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.86);
      font-size: 14px;
      pointer-events: none;
    }

    #scoreboard h3 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 16px;
    }

    #scoreboard table {
      width: 100%;
      border-collapse: collapse;
    }

    #scoreboard th,
    #scoreboard td {
      padding: 4px;
      text-align: center;
      border-bottom: 1px solid #555;
    }

    #scoreboard th {
      color: #00ff88;
    }

    #total {
      margin-top: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>

<body>
  <div id="status">AR RANGE — uruchamianie</div>
  <div id="crosshair" aria-hidden="true"></div>

  <div id="distanceMenu">
    <h2>Wybierz dystans</h2>
    <p>Wybierz odległość, a następnie skieruj telefon tam, gdzie chcesz zawiesić tarczę.</p>

    <button class="distanceButton" data-distance="10">10 metrów</button>
    <button class="distanceButton" data-distance="15">15 metrów</button>
    <button class="distanceButton" data-distance="25">25 metrów</button>
    <button class="distanceButton" data-distance="50">50 metrów</button>
    <button class="distanceButton" data-distance="100">100 metrów</button>
  </div>

  <div id="scoreboard">
    <h3>Wyniki strzelania</h3>
    <table>
      <thead>
        <tr>
          <th>Strzał</th>
          <th>Wynik</th>
          <th>Punkty</th>
        </tr>
      </thead>
      <tbody id="scoreRows"></tbody>
    </table>
    <div id="total">Suma: 0 / 50</div>
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

    const status = document.getElementById('status');
    const crosshair = document.getElementById('crosshair');
    const distanceMenu = document.getElementById('distanceMenu');
    const scoreboard = document.getElementById('scoreboard');
    const scoreRows = document.getElementById('scoreRows');
    const totalElement = document.getElementById('total');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const arButton = ARButton.createButton(renderer, {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body }
    });

    document.body.appendChild(arButton);

    function createTarget() {
      const group = new THREE.Group();

      const hitArea = new THREE.Mesh(
        new THREE.CircleGeometry(0.25, 96),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.001,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      group.add(hitArea);

      const background = new THREE.Mesh(
        new THREE.CircleGeometry(0.25, 96),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide
        })
      );

      background.position.z = -0.001;
      group.add(background);

      const blackCenter = new THREE.Mesh(
        new THREE.CircleGeometry(0.10, 96),
        new THREE.MeshBasicMaterial({
          color: 0x111111,
          side: THREE.DoubleSide
        })
      );

      blackCenter.position.z = 0.001;
      group.add(blackCenter);

      for (let i = 1; i <= 10; i++) {
        const radius = i * 0.025;

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(
            radius - 0.0008,
            radius + 0.0008,
            96
          ),
          new THREE.MeshBasicMaterial({
            color: i <= 4 ? 0xffffff : 0x111111,
            side: THREE.DoubleSide,
            depthTest: false
          })
        );

        ring.position.z = 0.003;
        ring.renderOrder = 2;
        group.add(ring);
      }

      const outline = new THREE.Mesh(
        new THREE.RingGeometry(0.249, 0.251, 96),
        new THREE.MeshBasicMaterial({
          color: 0x111111,
          side: THREE.DoubleSide
        })
      );

      outline.position.z = 0.004;
      group.add(outline);

      return group;
    }

    const target = createTarget();
    target.visible = false;
    scene.add(target);

    const controller = renderer.xr.getController(0);
    scene.add(controller);

    const raycaster = new THREE.Raycaster();

    const cameraPosition = new THREE.Vector3();
    const cameraDirection = new THREE.Vector3();
    const targetPosition = new THREE.Vector3();
    const targetNormal = new THREE.Vector3();
    const targetQuaternion = new THREE.Quaternion();
    const forwardAxis = new THREE.Vector3(0, 0, 1);

    const targetPlane = new THREE.Plane();
    const planeHitPoint = new THREE.Vector3();

    // Parametry gestu — będziemy je później dostrajać.
    const MIN_GESTURE_LENGTH = 80;

    // Gest musi rozpocząć się w dolnej, środkowej części ekranu.
    const TRIGGER_MIN_Y = 0.55;
    const TRIGGER_MIN_X = 0.25;
    const TRIGGER_MAX_X = 0.75;

    // Małe odchylenia ignorujemy; większe stopniowo zwiększają błąd.
    const HORIZONTAL_DEAD_ZONE = 0.02;
    const HORIZONTAL_MAX_SLOPE = 0.35;

    // Maksymalny poziomy błąd kątowy: 0,15 stopnia.
    const MAX_HORIZONTAL_ERROR = THREE.MathUtils.degToRad(0.15);

    let selectedDistance = 10;
    let placementPreview = false;
    let targetPlaced = false;
    let shotCount = 0;
    let totalPoints = 0;
    let gameFinished = false;
    let marker = null;
    let markerTimer = null;
    let placementAllowedAt = 0;

    let activeGesture = null;

    function updateTargetPreview() {
      if (!placementPreview || targetPlaced) return;

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(cameraPosition);
      xrCamera.getWorldDirection(cameraDirection);

      targetPosition.copy(cameraPosition).addScaledVector(
        cameraDirection,
        selectedDistance
      );

      targetNormal.copy(cameraDirection).negate();

      targetQuaternion.setFromUnitVectors(
        forwardAxis,
        targetNormal
      );

      target.position.copy(targetPosition);
      target.quaternion.copy(targetQuaternion);
      target.visible = true;
    }

    function getPoints(distanceFromCenter) {
      if (distanceFromCenter > 0.25) return 0;

      const zone = Math.max(
        1,
        Math.ceil(distanceFromCenter / 0.025)
      );

      return Math.max(1, 11 - zone);
    }

    function removeMarker() {
      if (markerTimer) {
        clearTimeout(markerTimer);
        markerTimer = null;
      }

      if (marker) {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();
        marker = null;
      }
    }

    function showMarker(point) {
      removeMarker();

      marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.012, 12, 10),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00,
          depthTest: false
        })
      );

      marker.position.copy(point);
      marker.renderOrder = 10;
      scene.add(marker);

      const currentMarker = marker;

      markerTimer = setTimeout(() => {
        scene.remove(currentMarker);
        currentMarker.geometry.dispose();
        currentMarker.material.dispose();

        if (marker === currentMarker) {
          marker = null;
          markerTimer = null;
        }
      }, 3000);
    }

    function addResult(points) {
      shotCount++;
      totalPoints += points;

      const row = document.createElement('tr');

      const shotCell = document.createElement('td');
      shotCell.textContent = shotCount;

      const resultCell = document.createElement('td');
      resultCell.textContent = points > 0 ? 'TRAFIENIE' : 'PUDŁO';

      const pointsCell = document.createElement('td');
      pointsCell.textContent = points;

      row.appendChild(shotCell);
      row.appendChild(resultCell);
      row.appendChild(pointsCell);

      scoreRows.appendChild(row);
      totalElement.textContent = 'Suma: ' + totalPoints + ' / 50';
    }

    function fireShot(horizontalErrorAngle) {
      if (!targetPlaced || gameFinished || shotCount >= 5) {
        return;
      }

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(cameraPosition);
      xrCamera.getWorldDirection(cameraDirection);

      // Tworzymy płaszczyznę tarczy.
      target.updateMatrixWorld(true);

      targetNormal.set(0, 0, 1)
        .applyQuaternion(target.quaternion)
        .normalize();

      targetPlane.setFromNormalAndCoplanarPoint(
        targetNormal,
        target.position
      );

      // Wyznaczamy punkt, w który wskazuje środek celownika,
      // nawet jeśli leży poza tarczą.
      raycaster.set(cameraPosition, cameraDirection);

      const centerAimPoint = raycaster.ray.intersectPlane(
        targetPlane,
        planeHitPoint
      );

      let points = 0;

      if (centerAimPoint !== null) {
        // Zamiana punktu celowania na współrzędne lokalne tarczy.
        const localPoint = target.worldToLocal(
          centerAimPoint.clone()
        );

        // Poziomy błąd gestu przesuwa punkt trafienia na tarczy.
        // Znak zachowuje kierunek ruchu palca.
        const horizontalOffset =
          selectedDistance * Math.tan(horizontalErrorAngle);

        localPoint.x += horizontalOffset;

        const distanceFromCenter = Math.sqrt(
          localPoint.x * localPoint.x +
          localPoint.y * localPoint.y
        );

        points = getPoints(distanceFromCenter);

        if (points > 0) {
          const impactPoint = target.localToWorld(
            localPoint.clone()
          );

          showMarker(impactPoint);
        } else {
          removeMarker();
        }
      } else {
        removeMarker();
      }

      addResult(points);

      if (points > 0) {
        status.textContent = 'TRAFIENIE! ' + points + ' pkt.';
        status.style.color = '#00ff88';
      } else {
        status.textContent = 'PUDŁO! 0 pkt.';
        status.style.color = '#ff7777';
      }

      if (shotCount === 5) {
        gameFinished = true;

        status.textContent =
          'KONIEC! Wynik: ' + totalPoints + ' / 50';

        status.style.color = '#00ff88';
        crosshair.style.display = 'none';
      } else {
        status.textContent += '  Strzał ' + shotCount + ' / 5';
      }
    }

    function calculateHorizontalError(dx, dy) {
      // Gest w dół ma dodatnie dy.
      if (dy <= 0) return null;

      const slope = dx / dy;
      const absSlope = Math.abs(slope);

      // Niewielkie odchylenie nie powoduje błędu.
      if (absSlope <= HORIZONTAL_DEAD_ZONE) {
        return 0;
      }

      // Ograniczamy błąd maksymalny.
      const normalizedError = THREE.MathUtils.clamp(
        (absSlope - HORIZONTAL_DEAD_ZONE) /
        (HORIZONTAL_MAX_SLOPE - HORIZONTAL_DEAD_ZONE),
        0,
        1
      );

      return Math.sign(dx) *
        normalizedError *
        MAX_HORIZONTAL_ERROR;
    }

    function handlePointerDown(event) {
      if (!targetPlaced || gameFinished || shotCount >= 5) return;
      if (distanceMenu.style.display === 'block') return;

      // Na razie obsługujemy gesty palcem, nie myszą.
      if (event.pointerType !== 'touch') return;

      const x = event.clientX / window.innerWidth;
      const y = event.clientY / window.innerHeight;

      // Pole spustu: dolna, środkowa część ekranu.
      if (
        x < TRIGGER_MIN_X ||
        x > TRIGGER_MAX_X ||
        y < TRIGGER_MIN_Y
      ) {
        return;
      }

      activeGesture = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        endX: event.clientX,
        endY: event.clientY
      };

      // Zapobiega przewijaniu strony podczas przeciągania.
      event.preventDefault();
    }

    function handlePointerMove(event) {
      if (
        !activeGesture ||
        event.pointerId !== activeGesture.pointerId
      ) {
        return;
      }

      activeGesture.endX = event.clientX;
      activeGesture.endY = event.clientY;

      event.preventDefault();
    }

    function handlePointerUp(event) {
      if (
        !activeGesture ||
        event.pointerId !== activeGesture.pointerId
      ) {
        return;
      }

      activeGesture.endX = event.clientX;
      activeGesture.endY = event.clientY;

      const gesture = activeGesture;
      activeGesture = null;

      event.preventDefault();

      const dx = gesture.endX - gesture.startX;
      const dy = gesture.endY - gesture.startY;
      const length = Math.sqrt(dx * dx + dy * dy);

      // Zbyt krótki ruch nie oddaje strzału.
      if (length < MIN_GESTURE_LENGTH) return;

      // Strzał wymaga ruchu w dół.
      if (dy <= 0) return;

      const horizontalError = calculateHorizontalError(dx, dy);

      if (horizontalError === null) return;

      fireShot(horizontalError);
    }

    document.addEventListener('pointerdown', handlePointerDown, {
      passive: false
    });

    document.addEventListener('pointermove', handlePointerMove, {
      passive: false
    });

    document.addEventListener('pointerup', handlePointerUp, {
      passive: false
    });

    document.addEventListener('pointercancel', () => {
      activeGesture = null;
    });

    document.querySelectorAll('.distanceButton').forEach(button => {
      button.addEventListener('click', () => {
        selectedDistance = Number(button.dataset.distance);

        distanceMenu.style.display = 'none';
        scoreboard.style.display = 'none';

        shotCount = 0;
        totalPoints = 0;
        gameFinished = false;
        targetPlaced = false;
        placementPreview = true;
        activeGesture = null;

        removeMarker();
        scoreRows.replaceChildren();
        totalElement.textContent = 'Suma: 0 / 50';

        target.visible = true;
        crosshair.style.display = 'block';

        placementAllowedAt = Date.now() + 500;

        status.textContent =
          'Podgląd tarczy: ' + selectedDistance +
          ' m. Wyceluj w miejsce i dotknij, aby zawiesić.';

        status.style.color = '#00ff88';
      });
    });

    controller.addEventListener('select', () => {
      // Dotknięcie służy wyłącznie do zawieszenia tarczy.
      // Po zawieszeniu strzał oddaje się gestem palca.
      if (placementPreview && !targetPlaced) {
        if (Date.now() < placementAllowedAt) return;

        updateTargetPreview();

        targetPlaced = true;
        placementPreview = false;

        scoreboard.style.display = 'block';

        status.textContent =
          'Tarcza zawieszona na ' + selectedDistance +
          ' m. Przeciągnij palcem w dół, aby strzelić.';

        status.style.color = '#00ff88';
      }
    });

    renderer.xr.addEventListener('sessionstart', () => {
      target.visible = false;
      targetPlaced = false;
      placementPreview = false;
      gameFinished = false;
      shotCount = 0;
      totalPoints = 0;
      activeGesture = null;

      removeMarker();
      scoreRows.replaceChildren();
      totalElement.textContent = 'Suma: 0 / 50';

      crosshair.style.display = 'none';
      scoreboard.style.display = 'none';

      distanceMenu.style.display = 'block';

      status.textContent = 'Wybierz dystans tarczy.';
      status.style.color = '#ffffff';
    });

    renderer.xr.addEventListener('sessionend', () => {
      target.visible = false;
      targetPlaced = false;
      placementPreview = false;
      activeGesture = null;

      distanceMenu.style.display = 'none';
      crosshair.style.display = 'none';
      scoreboard.style.display = 'none';
    });

    renderer.setAnimationLoop(() => {
      updateTargetPreview();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
