
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Range</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      z-index: 10000;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font: bold 38px Arial, sans-serif;
      text-shadow: 0 0 4px black, 0 0 8px black;
      z-index: 10001;
      pointer-events: none;
      display: none;
    }

    #instructions {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      color: white;
      text-align: center;
      font-size: 14px;
      text-shadow: 0 1px 5px black;
      z-index: 10000;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">AR RANGE — przygotowanie</div>
  <div id="crosshair">+</div>
  <div id="instructions">
    Uruchom AR i skieruj telefon na powierzchnię.
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';

    const status = document.getElementById('status');
    const crosshair = document.getElementById('crosshair');
    const instructions = document.getElementById('instructions');

    // SCENA
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');

    document.body.appendChild(renderer.domElement);

    // OŚWIETLENIE
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x777777, 2)
    );

    // KÓŁKO WSKAZUJĄCE MIEJSCE USTAWIENIA TARCZY
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.07, 0.09, 32),
      new THREE.MeshBasicMaterial({
        color: 0x00ff88,
        side: THREE.DoubleSide,
        depthTest: false
      })
    );

    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.renderOrder = 10;
    reticle.visible = false;
    scene.add(reticle);

    const targets = [];
    const hitMarkers = [];

    // TWORZENIE TARCZY
    function createTarget() {
      const group = new THREE.Group();

      const hitArea = new THREE.Mesh(
        new THREE.CircleGeometry(0.21, 48),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.001,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      hitArea.rotation.x = -Math.PI / 2;
      group.add(hitArea);

      function addRing(radius, thickness, color) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(radius, thickness, 12, 64),
          new THREE.MeshBasicMaterial({
            color: color
          })
        );

        ring.rotation.x = -Math.PI / 2;
        group.add(ring);
      }

      addRing(0.20, 0.012, 0xffffff);
      addRing(0.15, 0.015, 0xe52b2b);
      addRing(0.10, 0.012, 0xffffff);
      addRing(0.05, 0.018, 0xe52b2b);

      return group;
    }

    // PRZYCISK AR
    document.body.appendChild(
      ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test']
      })
    );

    // HIT TEST — WYKRYWANIE POWIERZCHNI
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // NARZĘDZIA DO STRZELANIA
    const raycaster = new THREE.Raycaster();
    const shotOrigin = new THREE.Vector3();
    const shotDirection = new THREE.Vector3();

    // ODDANIE STRZAŁU
    function shoot() {
      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(shotOrigin);
      xrCamera.getWorldDirection(shotDirection);

      raycaster.set(shotOrigin, shotDirection);

      const hits = raycaster.intersectObjects(targets, true);

      if (hits.length === 0) {
        status.textContent = 'PUDŁO!';
        status.style.color = '#ff7777';
        return;
      }

      const hit = hits[0];

      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.018, 16, 12),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00,
          depthTest: false
        })
      );

      marker.position.copy(hit.point);
      marker.renderOrder = 20;
      scene.add(marker);
      hitMarkers.push(marker);

      status.textContent = 'TRAFIENIE!';
      status.style.color = '#00ff88';

      setTimeout(() => {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();

        const index = hitMarkers.indexOf(marker);
        if (index !== -1) {
          hitMarkers.splice(index, 1);
        }
      }, 5000);
    }

    // DOTKNIĘCIE EKRANU:
    // PIERWSZE — USTAW TARCZĘ
    // KOLEJNE — STRZELAJ
    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (!renderer.xr.isPresenting) return;

      event.preventDefault();

      if (targets.length === 0) {
        if (!reticle.visible) {
          status.textContent =
            'Nie widzę powierzchni. Powoli porusz telefonem.';
          return;
        }

        const target = createTarget();

        target.position.setFromMatrixPosition(reticle.matrix);
        target.quaternion.setFromRotationMatrix(reticle.matrix);

        scene.add(target);
        targets.push(target);

        // KÓŁKO WYBORU ZNIKA PO USTAWIENIU TARCZY
        reticle.visible = false;

        crosshair.style.display = 'block';
        instructions.textContent =
          'Celuj znakiem + w tarczę i dotknij ekranu, aby strzelić.';

        status.textContent = 'TARCZA GOTOWA — ODDaj STRZAŁ';
        status.style.color = '#00ff88';

        return;
      }

      shoot();
    });

    // PĘTLA AR
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer')
            .then((viewerSpace) => {
              return session.requestHitTestSource({
                space: viewerSpace
              });
            })
            .then((source) => {
              hitTestSource = source;
            })
            .catch((error) => {
              status.textContent = 'Błąd wykrywania powierzchni AR';
              console.error(error);
            });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            reticle.visible = false;
            crosshair.style.display = 'none';

            status.textContent = 'AR RANGE — przygotowanie';
            instructions.textContent =
              'Uruchom AR i skieruj telefon na powierzchnię.';
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource && targets.length === 0) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);

            status.textContent =
              'Dotknij ekranu, aby ustawić tarczę.';
          } else {
            reticle.visible = false;

            status.textContent =
              'Powoli porusz telefonem, aby znaleźć powierzchnię.';
          }
        } else if (targets.length > 0) {
          reticle.visible = false;
        }
      }

      renderer.render(scene, camera);
    });

    // ZMIANA ROZMIARU OKNA
    window.addEventListener('resize', () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
