<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Range Beta 0.13</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    /* MENU GŁÓWNE */

    #mainMenu,
    #competitionLaunch {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: radial-gradient(ellipse at center, #202b35 0%, #10151b 65%, #050709 100%);
    }

    #mainMenu {
      display: flex;
    }

    #mainMenu h1 {
      margin: 0 0 4px;
      font-size: clamp(34px, 9vw, 52px);
      letter-spacing: 5px;
      text-align: center;
    }

    .menuSubtitle {
      margin: 0 0 24px;
      color: #aebdc9;
      font-size: 12px;
      letter-spacing: 3px;
      text-align: center;
    }

    .mainMenuButton {
      width: min(340px, 100%);
      min-height: 54px;
      padding: 14px 18px;
      border: 1px solid #52616d;
      border-radius: 10px;
      background: rgba(39, 53, 65, .85);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1.5px;
      touch-action: manipulation;
    }

    .mainMenuButton:active:not(:disabled) {
      background: #36566a;
    }

    .mainMenuButton:disabled {
      opacity: .35;
      border-color: #444;
      color: #8a939a;
    }

    .menuFooter {
      margin-top: 20px;
      color: #687681;
      font-size: 11px;
      letter-spacing: 2px;
    }

    #competitionLaunch h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 3px;
      text-align: center;
    }

    #competitionLaunch p {
      max-width: 330px;
      color: #bdc8d0;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    #launchBackButton {
      position: absolute;
      bottom: 25px;
      padding: 12px 20px;
      border: 1px solid #697680;
      border-radius: 9px;
      background: #202a32;
      color: white;
      font-size: 14px;
      touch-action: manipulation;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.72);
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      top: calc(50% + var(--crosshair-screen-y, 0px));
      left: calc(50% + var(--crosshair-screen-x, 0px));
      transform: translate(-50%,-50%);
      z-index: 10;
      width: 24px;
      height: 24px;
      display: none;
      pointer-events: none;
    }

    #crosshair::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 0;
      width: 1px;
      height: 24px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #crosshair::after {
      content: "";
      position: absolute;
      left: 0;
      top: 11px;
      width: 24px;
      height: 1px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #crosshair.dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 2px #000, 0 0 4px #000;
    }

    #crosshair.dot::before,
    #crosshair.dot::after {
      display: none;
    }

    #scoreboard {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 10;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.78);
      font-size: 14px;
      pointer-events: none;
    }

    #scoreboard h3 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 16px;
    }

    #scoreboard table {
      width: 100%;
      border-collapse: collapse;
    }

    #scoreboard th,
    #scoreboard td {
      padding: 4px;
      text-align: center;
      border-bottom: 1px solid #555;
    }
