
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Range Beta 0.7</title>

  <!-- Wspólna wersja Three.js dla silnika, AR i modelu GLB -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 10;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.82);
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 24px;
      height: 24px;
      display: none;
      pointer-events: none;
    }

    #crosshair::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 0;
      width: 1px;
      height: 24px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #crosshair::after {
      content: "";
      position: absolute;
      left: 0;
      top: 11px;
      width: 24px;
      height: 1px;
      background: #fff;
      box-shadow: 0 0 1px #000, 0 0 2px #000;
    }

    #scoreboard {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 12px;
      z-index: 10;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.86);
      font-size: 14px;
      pointer-events: none;
    }

    #scoreboard h3 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 16px;
    }

    #scoreboard table {
      width: 100%;
      border-collapse: collapse;
    }

    #scoreboard th,
    #scoreboard td {
      padding: 4px;
      text-align: center;
      border-bottom: 1px solid #555;
    }

    #scoreboard th {
      color: #00ff88;
    }

    #total {
      margin-top: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>

<body>
  <div id="status">AR RANGE — uruchamianie</div>
  <div id="crosshair" aria-hidden="true"></div>

  <div id="scoreboard">
    <h3>Wyniki strzelania</h3>
    <table>
      <thead>
        <tr>
          <th>Strzał</th>
          <th>Wynik</th>
          <th>Punkty</th>
        </tr>
      </thead>
      <tbody id="scoreRows"></tbody>
    </table>
    <div id="total">Suma: 0 / 50</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');
    const crosshair = document.getElementById('crosshair');
    const scoreboard = document.getElementById('scoreboard');
    const scoreRows = document.getElementById('scoreRows');
    const totalElement = document.getElementById('total');

    const DISTANCES = [1, 5, 10, 15, 25, 50, 100];

    const TARGET_TYPES = [
      { id: 'sport', name: 'Tarcza sportowa' },
      { id: 'precision', name: 'Tarcza precyzyjna' },
      { id: 'reactive', name: 'Tarcza reaktywna' }
    ];

    const MIN_GESTURE_LENGTH = 80;
    const PLACEMENT_COOLDOWN = 500;

    const HORIZONTAL_DEAD_ZONE = 0.02;
    const HORIZONTAL_MAX_SLOPE = 0.35;
    const MAX_HORIZONTAL_ERROR =
      THREE.MathUtils.degToRad(0.15);

    const TRIGGER_MIN_X = 0.25;
    const TRIGGER_MAX_X = 0.75;
    const TRIGGER_MIN_Y = 0.55;

    const scene = new THREE.Scene();

    // Oświetlenie modelu 3D.
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x555566, 2.0)
    );

    const weaponLight = new THREE.DirectionalLight(0xffffff, 2.0);
    weaponLight.position.set(0.5, 1, 1);
    scene.add(weaponLight);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // =====================================================
    // MODEL GLOCKA — ładowany niezależnie od uruchamiania AR
    // =====================================================

    const weaponRoot = new THREE.Group();
    weaponRoot.visible = false;
    scene.add(weaponRoot);

    let weaponLoaded = false;

    const weaponWorldPosition = new THREE.Vector3();
    const weaponWorldQuaternion = new THREE.Quaternion();
    const weaponOffset = new THREE.Vector3();

    const gltfLoader = new GLTFLoader();

    const weaponPath =
      './assets/weapons/glock/Glock%2019%20Gen%204%20(1).glb';

    gltfLoader.load(
      weaponPath,
      (gltf) => {
        const model = gltf.scene;

        // Obliczamy rozmiar modelu i skalujemy go do
        // realistycznego, niewielkiego rozmiaru ekranowego.
        model.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        bounds.getSize(size);
        bounds.getCenter(center);

        const largestDimension = Math.max(
          size.x, size.y, size.z
        );

        if (!Number.isFinite(largestDimension) ||
            largestDimension <= 0) {
          console.warn('Glock: nieprawidłowy rozmiar modelu.');
          return;
        }

        // Długość największego wymiaru modelu: około 35 cm.
        const modelScale = 0.35 / largestDimension;
        model.scale.setScalar(modelScale);

        // Umieszczamy środek modelu przy początku jego układu.
        model.position.set(
          -center.x * modelScale,
          -center.y * modelScale,
          -center.z * modelScale
        );

        // Wstępna korekta orientacji modelu.
        // Jeśli lufa będzie skierowana w złą stronę,
        // dopasujemy obrót po pierwszym teście.
        model.rotation.set(0, 0, 0);

        weaponRoot.add(model);
        weaponLoaded = true;

        // Jeżeli model załadował się podczas sesji AR,
        // pokazujemy go od razu.
        weaponRoot.visible = renderer.xr.isPresenting;

        console.log('Glock załadowany.');
      },
      undefined,
      (error) => {
        // Błąd modelu nie powinien zatrzymywać samej gry.
        console.warn('Nie udało się załadować modelu Glocka:', error);
      }
    );

    function updateWeaponPose() {
      if (!weaponLoaded || !renderer.xr.isPresenting) return;

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(weaponWorldPosition);
      xrCamera.getWorldQuaternion(weaponWorldQuaternion);

      // Pozycja względem widoku: lekko w prawo,
      // w dół i przed kamerą.
      weaponOffset.set(0.00, -0.12, -0.42);
      weaponOffset.applyQuaternion(weaponWorldQuaternion);

      weaponRoot.position.copy(weaponWorldPosition);
      weaponRoot.position.add(weaponOffset);
      weaponRoot.quaternion.copy(weaponWorldQuaternion);
    }

    // Przycisk AR tworzymy niezależnie od wyniku ładowania Glocka.
    const arButton = ARButton.createButton(renderer, {
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body }
    });

    document.body.appendChild(arButton);

    function addDisc(group, radius, color, z) {
      const mesh = new THREE.Mesh(
        new THREE.CircleGeometry(radius, 96),
        new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide
        })
      );

      mesh.position.z = z;
      group.add(mesh);
      return mesh;
    }

    function addRing(group, radius, color, z, thickness = 0.0016) {
      const mesh = new THREE.Mesh(
        new THREE.RingGeometry(
          Math.max(0.001, radius - thickness / 2),
          radius + thickness / 2,
          96
        ),
        new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide,
          depthTest: false
        })
      );

      mesh.position.z = z;
      mesh.renderOrder = 2;
      group.add(mesh);
      return mesh;
    }

    function createTarget(type) {
      const group = new THREE.Group();

      const hitArea = new THREE.Mesh(
        new THREE.CircleGeometry(0.25, 96),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0.001,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );

      group.add(hitArea);

      if (type === 'sport') {
        addDisc(group, 0.25, 0xffffff, -0.001);
        addDisc(group, 0.10, 0x111111, 0.001);

        for (let i = 1; i <= 10; i++) {
          addRing(
            group,
            i * 0.025,
            i <= 4 ? 0xffffff : 0x111111,
            0.003
          );
        }
      }

      if (type === 'precision') {
        addDisc(group, 0.25, 0xffffff, -0.001);

        for (let i = 1; i <= 10; i++) {
          addRing(group, i * 0.025, 0x111111, 0.002, 0.0012);
        }

        addDisc(group, 0.018, 0xc62828, 0.004);
        addRing(group, 0.025, 0x111111, 0.005, 0.0012);
      }

      if (type === 'reactive') {
        addDisc(group, 0.25, 0x252a30, -0.001);
        addDisc(group, 0.20, 0xffffff, 0.001);
        addDisc(group, 0.15, 0x24a148, 0.002);
        addDisc(group, 0.10, 0xf5c542, 0.003);
        addDisc(group, 0.05, 0xe87528, 0.004);
        addDisc(group, 0.022, 0xd62828, 0.005);

        for (let i = 1; i <= 10; i++) {
          addRing(group, i * 0.025, 0x111111, 0.007, 0.001);
        }
      }

      addRing(group, 0.25, 0x111111, 0.008, 0.002);

      return group;
    }

    function disposeTarget(object) {
      object.traverse(child => {
        if (child.geometry) child.geometry.dispose();

        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach(material => material.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    }

    let selectedDistance = 25;
    let selectedTargetIndex = 0;

    let target = createTarget(TARGET_TYPES[selectedTargetIndex].id);
    target.visible = false;
    scene.add(target);

    const controller = renderer.xr.getController(0);
    scene.add(controller);

    const raycaster = new THREE.Raycaster();

    const cameraPosition = new THREE.Vector3();
    const cameraDirection = new THREE.Vector3();
    const targetPosition = new THREE.Vector3();
    const targetNormal = new THREE.Vector3();
    const targetQuaternion = new THREE.Quaternion();
    const forwardAxis = new THREE.Vector3(0, 0, 1);
    const targetPlane = new THREE.Plane();
    const planeHitPoint = new THREE.Vector3();

    let placementPreview = false;
    let targetPlaced = false;
    let shotCount = 0;
    let totalPoints = 0;
    let gameFinished = false;
    let marker = null;
    let markerTimer = null;
    let placementAllowedAt = 0;
    let activeGesture = null;

    function updateStatusForPreparation(message = '') {
      const targetName = TARGET_TYPES[selectedTargetIndex].name;

      status.textContent =
        targetName + ' · ' + selectedDistance + ' m' +
        (message ? ' · ' + message : '');

      status.style.color = '#00ff88';
    }

    function updateTargetPreview() {
      if (!placementPreview || targetPlaced) return;

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(cameraPosition);
      xrCamera.getWorldDirection(cameraDirection);

      targetPosition.copy(cameraPosition).addScaledVector(
        cameraDirection,
        selectedDistance
      );

      targetNormal.copy(cameraDirection).negate();

      targetQuaternion.setFromUnitVectors(
        forwardAxis,
        targetNormal
      );

      target.position.copy(targetPosition);
      target.quaternion.copy(targetQuaternion);
      target.visible = true;
    }

    function replaceTarget() {
      const oldTarget = target;

      scene.remove(oldTarget);
      disposeTarget(oldTarget);

      target = createTarget(TARGET_TYPES[selectedTargetIndex].id);
      target.visible = true;
      scene.add(target);
    }

    function changeTarget(direction) {
      selectedTargetIndex =
        (selectedTargetIndex + direction + TARGET_TYPES.length) %
        TARGET_TYPES.length;

      placementAllowedAt = Date.now() + PLACEMENT_COOLDOWN;

      replaceTarget();

      updateStatusForPreparation(
        'zmiana tarczy — dotknij ponownie, aby zawiesić'
      );
    }

    function changeDistance(direction) {
      let index = DISTANCES.indexOf(selectedDistance);

      index = THREE.MathUtils.clamp(
        index + direction,
        0,
        DISTANCES.length - 1
      );

      selectedDistance = DISTANCES[index];

      placementAllowedAt = Date.now() + PLACEMENT_COOLDOWN;

      updateStatusForPreparation(
        'zmiana dystansu — dotknij ponownie, aby zawiesić'
      );
    }

    function getPoints(distanceFromCenter) {
      if (distanceFromCenter > 0.25) return 0;

      const zone = Math.max(
        1,
        Math.ceil(distanceFromCenter / 0.025)
      );

      return Math.max(1, 11 - zone);
    }

    function removeMarker() {
      if (markerTimer) {
        clearTimeout(markerTimer);
        markerTimer = null;
      }

      if (marker) {
        scene.remove(marker);
        marker.geometry.dispose();
        marker.material.dispose();
        marker = null;
      }
    }

    function showMarker(point) {
      removeMarker();

      marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.012, 12, 10),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00,
          depthTest: false
        })
      );

      marker.position.copy(point);
      marker.renderOrder = 10;
      scene.add(marker);

      const currentMarker = marker;

      markerTimer = setTimeout(() => {
        scene.remove(currentMarker);
        currentMarker.geometry.dispose();
        currentMarker.material.dispose();

        if (marker === currentMarker) {
          marker = null;
          markerTimer = null;
        }
      }, 3000);
    }

    function addResult(points) {
      shotCount++;
      totalPoints += points;

      const row = document.createElement('tr');

      const shotCell = document.createElement('td');
      shotCell.textContent = shotCount;

      const resultCell = document.createElement('td');
      resultCell.textContent = points > 0 ? 'TRAFIENIE' : 'PUDŁO';

      const pointsCell = document.createElement('td');
      pointsCell.textContent = points;

      row.appendChild(shotCell);
      row.appendChild(resultCell);
      row.appendChild(pointsCell);

      scoreRows.appendChild(row);
      totalElement.textContent = 'Suma: ' + totalPoints + ' / 50';
    }

    function calculateHorizontalError(dx, dy) {
      if (dy <= 0) return null;

      const slope = dx / dy;
      const absoluteSlope = Math.abs(slope);

      if (absoluteSlope <= HORIZONTAL_DEAD_ZONE) {
        return 0;
      }

      const normalizedError = THREE.MathUtils.clamp(
        (absoluteSlope - HORIZONTAL_DEAD_ZONE) /
        (HORIZONTAL_MAX_SLOPE - HORIZONTAL_DEAD_ZONE),
        0,
        1
      );

      return Math.sign(dx) *
        normalizedError *
        MAX_HORIZONTAL_ERROR;
    }

    function fireShot(horizontalErrorAngle) {
      if (!targetPlaced || gameFinished || shotCount >= 5) return;

      const xrCamera = renderer.xr.getCamera(camera);

      xrCamera.updateMatrixWorld(true);
      xrCamera.getWorldPosition(cameraPosition);
      xrCamera.getWorldDirection(cameraDirection);

      target.updateMatrixWorld(true);

      targetNormal.set(0, 0, 1)
        .applyQuaternion(target.quaternion)
        .normalize();

      targetPlane.setFromNormalAndCoplanarPoint(
        targetNormal,
        target.position
      );

      raycaster.set(cameraPosition, cameraDirection);

      const centerAimPoint = raycaster.ray.intersectPlane(
        targetPlane,
        planeHitPoint
      );

      let points = 0;

      if (centerAimPoint !== null) {
        const localPoint = target.worldToLocal(
          centerAimPoint.clone()
        );

        const horizontalOffset =
          selectedDistance * Math.tan(horizontalErrorAngle);

        localPoint.x += horizontalOffset;

        const distanceFromCenter = Math.sqrt(
          localPoint.x * localPoint.x +
          localPoint.y * localPoint.y
        );

        points = getPoints(distanceFromCenter);

        if (points > 0) {
          showMarker(target.localToWorld(localPoint.clone()));
        } else {
          removeMarker();
        }
      } else {
        removeMarker();
      }

      addResult(points);

      if (points > 0) {
        status.textContent = 'TRAFIENIE! ' + points + ' pkt.';
        status.style.color = '#00ff88';
      } else {
        status.textContent = 'PUDŁO! 0 pkt.';
        status.style.color = '#ff7777';
      }

      if (shotCount === 5) {
        gameFinished = true;

        status.textContent =
          'KONIEC! Wynik: ' + totalPoints + ' / 50';

        status.style.color = '#00ff88';
        crosshair.style.display = 'none';
      } else {
        status.textContent += '  Strzał ' + shotCount + ' / 5';
      }
    }

    function handlePointerDown(event) {
      if (event.pointerType !== 'touch') return;
      if (gameFinished || shotCount >= 5) return;

      const x = event.clientX / window.innerWidth;
      const y = event.clientY / window.innerHeight;

      if (targetPlaced) {
        if (
          x < TRIGGER_MIN_X ||
          x > TRIGGER_MAX_X ||
          y < TRIGGER_MIN_Y
        ) {
          return;
        }
      }

      activeGesture = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        endX: event.clientX,
        endY: event.clientY
      };

      event.preventDefault();
    }

    function handlePointerMove(event) {
      if (
        !activeGesture ||
        event.pointerId !== activeGesture.pointerId
      ) {
        return;
      }

      activeGesture.endX = event.clientX;
      activeGesture.endY = event.clientY;

      event.preventDefault();
    }

    function handlePointerUp(event) {
      if (
        !activeGesture ||
        event.pointerId !== activeGesture.pointerId
      ) {
        return;
      }

      activeGesture.endX = event.clientX;
      activeGesture.endY = event.clientY;

      const gesture = activeGesture;
      activeGesture = null;

      event.preventDefault();

      const dx = gesture.endX - gesture.startX;
      const dy = gesture.endY - gesture.startY;
      const length = Math.sqrt(dx * dx + dy * dy);

      if (length < MIN_GESTURE_LENGTH) return;

      if (!targetPlaced) {
        placementAllowedAt = Date.now() + PLACEMENT_COOLDOWN;

        if (Math.abs(dx) > Math.abs(dy) * 1.2) {
          changeTarget(dx > 0 ? 1 : -1);
          return;
        }

        if (Math.abs(dy) > Math.abs(dx) * 1.2) {
          changeDistance(dy < 0 ? 1 : -1);
          return;
        }

        updateStatusForPreparation(
          'gest powinien być poziomy lub pionowy'
        );

        return;
      }

      if (dy <= 0) return;

      const horizontalError = calculateHorizontalError(dx, dy);

      if (horizontalError === null) return;

      fireShot(horizontalError);
    }

    document.addEventListener('pointerdown', handlePointerDown, {
      passive: false
    });

    document.addEventListener('pointermove', handlePointerMove, {
      passive: false
    });

    document.addEventListener('pointerup', handlePointerUp, {
      passive: false
    });

    document.addEventListener('pointercancel', () => {
      activeGesture = null;
    });

    controller.addEventListener('select', () => {
      if (!placementPreview || targetPlaced) return;
      if (activeGesture !== null) return;
      if (Date.now() < placementAllowedAt) return;

      updateTargetPreview();

      targetPlaced = true;
      placementPreview = false;

      scoreboard.style.display = 'block';

      status.textContent =
        'Tarcza zawieszona. Gest w dół w dolnej części ekranu — strzał.';

      status.style.color = '#00ff88';
    });

    renderer.xr.addEventListener('sessionstart', () => {
      selectedDistance = 25;
      selectedTargetIndex = 0;

      scene.remove(target);
      disposeTarget(target);

      target = createTarget(TARGET_TYPES[selectedTargetIndex].id);
      scene.add(target);
      target.visible = true;

      targetPlaced = false;
      placementPreview = true;
      gameFinished = false;
      shotCount = 0;
      totalPoints = 0;
      activeGesture = null;

      removeMarker();
      scoreRows.replaceChildren();
      totalElement.textContent = 'Suma: 0 / 50';

      crosshair.style.display = 'block';
      scoreboard.style.display = 'none';

      // Model pokaże się tylko wtedy, gdy zdążył się załadować.
      weaponRoot.visible = weaponLoaded;

      placementAllowedAt = Date.now() + PLACEMENT_COOLDOWN;

      updateStatusForPreparation(
        'przesuń poziomo: tarcza · pionowo: dystans'
      );
    });

    renderer.xr.addEventListener('sessionend', () => {
      target.visible = false;
      targetPlaced = false;
      placementPreview = false;
      activeGesture = null;

      weaponRoot.visible = false;
      crosshair.style.display = 'none';
      scoreboard.style.display = 'none';
    });

    renderer.setAnimationLoop(() => {
      updateTargetPreview();
      updateWeaponPose();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
